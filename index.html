<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>블리비의원 금액권 수첩</title>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#F8F5F3;--card:#fff;--ink:#2A2227;--ink2:#5B4F56;--muted:#91848A;
  --line:#EFE6E2;--line2:#F6F0ED;
  --rose:#D2627E;--rose-d:#B04765;--plum:#59303F;
  --soft:#FCF0F3;--gold:#A97C34;--violet:#6B4AA0;
  --green:#2C8A70;--green-soft:#E9F5F0;
  --shadow:0 1px 2px rgba(70,40,50,.04),0 10px 26px -18px rgba(70,40,50,.32);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#F8F5F3;color:var(--ink);font-size:15px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button,input{font-family:inherit}
a{color:var(--rose-d);text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 46px}

/* brand */
.brand{display:flex;align-items:center;gap:11px;padding:20px 2px 14px}
.brandmark{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,#fff,#FDEFF3);border:1px solid #F4E3E8;box-shadow:0 8px 18px -13px rgba(120,60,80,.7)}
.brand h1{margin:0;font-size:16.5px;font-weight:750;letter-spacing:-.02em}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}

/* sticky nav */
.sticky{position:sticky;top:0;z-index:20;margin:0 -16px;padding:6px 16px 0;
  background:rgba(248,245,243,.94);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);
  border-bottom:1px solid rgba(0,0,0,.045)}
.branchtabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#EFE7E3;padding:4px;border-radius:14px}
.btab{border:0;background:transparent;border-radius:11px;padding:7px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;
  cursor:pointer;color:#7C6E75;transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent}
.btab .btab-name{font-size:14px;font-weight:700;letter-spacing:-.01em}
.btab .btab-sub{color:#9C8F95}
.btab.on{background:#fff;color:var(--plum);box-shadow:0 1px 5px rgba(90,50,65,.12)}
.btab.on .btab-sub{color:var(--rose-d)}
.sectiontabs{display:flex;gap:20px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
.sectiontabs::-webkit-scrollbar{display:none}
.sectiontabs button{border:0;background:none;padding:10px 1px 12px;font-size:14.5px;font-weight:700;color:#A0959A;
  cursor:pointer;position:relative;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.sectiontabs button.on{color:var(--plum)}
.sectiontabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;border-radius:3px;
  background:linear-gradient(90deg,var(--rose),#E39AAC)}

.view{padding-top:14px}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 16px;box-shadow:var(--shadow);margin-top:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.card-head h3{margin:0;font-size:15px;font-weight:750;letter-spacing:-.01em}
.card-head .cap{font-size:11.5px;color:var(--muted);font-weight:600}
.note{margin:8px 0 0;font-size:11.5px;line-height:1.55;color:var(--muted)}
.note b{color:var(--ink2);font-weight:700}
.link{background:none;border:0;padding:0;color:var(--rose-d);font-weight:700;font-size:12.5px;cursor:pointer}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:17px 18px 16px;color:#fff;margin-top:2px;
  background:linear-gradient(135deg,#59303F 0%,#8A5165 58%,#AB6E83 100%);
  box-shadow:0 16px 34px -22px rgba(90,49,64,.9)}
.hero::after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-80px;top:-100px;
  background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.hero-b{font-size:12px;font-weight:700;letter-spacing:.02em;color:rgba(255,255,255,.92)}
.hero-card{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.34);border-radius:99px;padding:3px 9px}
.hero-label{margin:15px 0 1px;font-size:12.5px;color:rgba(255,255,255,.76);font-weight:600}
.hero-amount{margin:0;font-size:34px;line-height:1.12;font-weight:800;letter-spacing:-.035em}
.hero-amount .won{font-size:17px;font-weight:650;margin-left:3px;opacity:.88}
.hero-amount.neg{color:#FFD6DE}
.hero-sub{margin:6px 0 0;font-size:11.5px;color:rgba(255,255,255,.72);font-weight:600}
.hero-actions{display:flex;gap:8px;margin-top:15px;position:relative;z-index:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:12px;
  font-size:14px;font-weight:700;border:0;cursor:pointer;flex:1;transition:transform .08s ease,opacity .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,#D2627E,#C2506C);color:#fff;box-shadow:0 10px 20px -14px rgba(180,70,100,.95)}
.btn.light{background:#fff;color:var(--plum)}
.btn.outline{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.36)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2);font-weight:650}
.btn.danger{color:#AE3D48;border-color:#F0D6D9}
.btn.sm{height:33px;padding:0 11px;font-size:12.5px;border-radius:9px;flex:none;font-weight:700}
.btn.on{background:var(--green-soft);border-color:#CDE8DE;color:var(--green)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 11px 10px;box-shadow:var(--shadow);min-width:0}
.stat-label{margin:0;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:-.01em}
.stat-value{margin:5px 0 0;font-size:clamp(13.5px,4.1vw,16.5px);font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.stat-sub{margin:4px 0 0;font-size:10px;color:var(--muted);line-height:1.45;font-weight:600}

/* badges */
.badge{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:6px;font-size:10.5px;font-weight:800;
  letter-spacing:-.01em;white-space:nowrap;flex:none}
.b-trial{background:#FCE7EC;color:#AB3A58}
.b-limited{background:#F1EAFB;color:#5F3F97}
.b-both{background:linear-gradient(120deg,#FCE7EC,#F1EAFB);color:#7A3560}
.b-normal{background:#F2EFED;color:#7C7176}
.b-used{background:var(--green-soft);color:var(--green)}

/* progress */
.prog{margin-top:11px}
.prog:first-of-type{margin-top:4px}
.prog-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2);font-weight:600;gap:8px}
.prog-top .pct{font-weight:800;color:var(--muted);font-size:11.5px}
.bar{height:7px;border-radius:99px;background:#F1EAE7;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#D2627E,#E7A3B4);transition:width .3s}
.bar.gold i{background:linear-gradient(90deg,#A97C34,#D6B47C)}

/* price list */
.pricehead{margin-top:0}
.searchbar{position:relative;display:flex;align-items:center;margin-top:11px}
.searchbar .sicon{position:absolute;left:12px;font-size:16px;color:#B3A6AC;pointer-events:none}
.searchbar input{width:100%;height:44px;border:1px solid #E7DDD8;border-radius:12px;background:#FDFCFB;padding:0 62px 0 34px;
  font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.searchbar input::-webkit-search-cancel-button{-webkit-appearance:none}
.searchbar input:focus{outline:none;border-color:#DE9AAE;box-shadow:0 0 0 3px rgba(210,98,126,.13);background:#fff}
.scount{position:absolute;right:12px;font-size:11.5px;color:var(--muted);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:99px;height:32px;padding:0 12px;
  font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.plist{margin-top:10px}
.pitem{border:1px solid var(--line);border-radius:16px;padding:12px 13px;background:#fff;box-shadow:0 1px 2px rgba(70,40,50,.03)}
.pitem + .pitem{margin-top:8px}
.pitem.is-used{background:#FBFDFC;border-color:#DFEEE8}
.pitem-top{display:flex;align-items:flex-start;gap:5px;flex-wrap:wrap}
.pname{flex:1 1 60%;min-width:0;font-size:13.8px;font-weight:700;line-height:1.42;letter-spacing:-.015em}
.pmeta{border:0;background:none;padding:3px 0 0;margin:0;width:100%;display:flex;align-items:center;gap:5px;
  font-size:11.5px;color:var(--muted);text-align:left;cursor:pointer;font-weight:600}
.pmeta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta .caret{font-size:9px;opacity:.8;flex:none}
.pbottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:9px}
.pamt{font-size:16px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.pamt .cur{font-size:12px;font-weight:700;margin-left:1px}
.pvat{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:2px}
.pacts{display:flex;gap:5px;flex:none}
.offers{list-style:none;margin:9px 0 0;padding:8px 0 0;border-top:1px dashed var(--line);font-size:12px}
.offers li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--ink2)}
.offers .ev{color:var(--ink2);font-weight:600}
.offers .num{color:var(--muted);text-align:right;white-space:nowrap}
.offers s{opacity:.6;font-weight:500}
.loadmore{margin-top:10px}
.loadmore .btn{width:100%}

/* history */
.hlist{margin-top:2px}
.hrow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line2)}
.hrow:first-child{border-top:0;padding-top:4px}
.hicon{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:800;
  background:var(--soft);color:var(--rose-d)}
.hicon.use{background:#F1F5FB;color:#3F63A2}
.hbody{flex:1;min-width:0}
.htitle{font-size:13.5px;font-weight:700;line-height:1.42;letter-spacing:-.015em;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.hsub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45;font-weight:600;word-break:keep-all}
.hright{text-align:right;flex:none}
.hamt{font-size:14px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.hamt.in{color:var(--green)}
.hdate{font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:600}
.hacts{display:flex;flex-direction:column;gap:1px;margin-left:-2px}
.iconbtn{width:26px;height:24px;border:0;background:transparent;color:#B3A6AC;font-size:12px;border-radius:7px;cursor:pointer;line-height:1}
.iconbtn:active{background:#F6F1EE}

/* forms */
.field{display:block;margin-top:13px}
.field > span{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
input[type=date],input[type=text],input[type=number]{width:100%;height:46px;border:1px solid #E7DDD8;border-radius:12px;
  background:#FDFCFB;padding:0 12px;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=number]{-moz-appearance:textfield}
input:focus{outline:none;border-color:#DE9AAE;box-shadow:0 0 0 3px rgba(210,98,126,.13);background:#fff}
.searchwrap{position:relative}
.searchwrap .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:#F3EDEA;
  border-radius:50%;color:#9B8D93;font-size:12px;cursor:pointer}
.suggest{margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;max-height:236px;overflow-y:auto}
.sitem{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-top:1px solid var(--line2);background:#fff;
  padding:9px 11px;text-align:left;cursor:pointer;font-size:12.5px;line-height:1.4;color:var(--ink)}
.sitem:first-child{border-top:0}
.sitem:active{background:#FDF6F8}
.sitem .sname{flex:1;min-width:0;font-weight:650}
.sitem .sprice{color:var(--rose-d);font-weight:800;white-space:nowrap}
.hint{margin:6px 0 0;font-size:11px;color:var(--muted);line-height:1.5}
.calcbox{margin-top:13px;border:1px solid var(--line);background:#FCFAF9;border-radius:14px;padding:10px 13px;font-size:13px}
.calcbox > div{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink2);font-weight:600}
.calcbox .total{border-top:1px dashed #E6DCD7;margin-top:5px;padding-top:8px;color:var(--ink);font-weight:800;font-size:14.5px}
.flag{margin-top:11px;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;font-weight:600}
.guard{margin-top:12px;border:1px solid #F3D9C3;background:#FDF6EC;border-radius:14px;padding:11px 13px;font-size:12.5px;color:#7A5524;line-height:1.5}
.guard b{display:block;font-size:13px;color:#8A5A1E;margin-bottom:3px}
.guard p{margin:0;color:#8E6A3C;font-size:11.5px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;margin-top:9px;color:#6E4A18}
.check input{width:18px;height:18px;accent-color:#B98A46;flex:none}
.balancehint{margin:11px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5;font-weight:600}
.balancehint.warn{color:#B3502F}
.formfoot{display:flex;gap:8px;margin-top:16px}
.quickrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* branch info */
.info{margin:0;font-size:13.5px}
.info > div{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2)}
.info > div:first-child{border-top:0;padding-top:2px}
.info dt{width:62px;flex:none;color:var(--muted);font-size:12px;font-weight:700;padding-top:1px}
.info dd{margin:0;line-height:1.55;font-weight:600}
.info dd .sub{display:block;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:2px}
.event{border-top:1px solid var(--line2);padding:10px 0}
.event:first-child{border-top:0;padding-top:2px}
.evname{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13.5px;font-weight:750}
.evdate{font-size:10.5px;color:var(--muted);font-weight:600;flex:none}
.evdesc{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.evnotes{margin:6px 0 0;padding-left:0;list-style:none;font-size:11.5px;color:var(--ink2);line-height:1.55}
.evnotes li{position:relative;padding-left:10px;margin-top:2px}
.evnotes li::before{content:"·";position:absolute;left:1px;color:#C4B5BA}
.evfoot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:8px}
.evcount{font-size:10.5px;color:var(--muted);font-weight:700}
.evbtn{border:1px solid var(--line);background:#fff;border-radius:8px;height:28px;padding:0 9px;font-size:11px;font-weight:700;color:var(--ink2);cursor:pointer}

/* misc */
.empty{text-align:center;padding:24px 8px;color:var(--muted);font-size:12.5px;line-height:1.6;font-weight:600}
.empty b{display:block;color:var(--ink);font-size:14px;font-weight:750;margin-bottom:4px}
.alertbar.seeded .link{display:block;margin-top:7px;text-decoration:underline;font-size:12px}
.alertbar{margin-top:12px;border:1px solid #F2D9C0;background:#FDF7EE;color:#8A5A1E;border-radius:14px;padding:10px 13px;font-size:12px;line-height:1.5;font-weight:600}
.datarow{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.datarow .btn{height:38px;font-size:12.5px}
.foot{margin-top:24px;text-align:center;font-size:10.5px;color:#A79AA0;line-height:1.65;font-weight:600}

/* sheet */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(40,24,31,.44);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;box-shadow:0 -12px 44px rgba(40,20,30,.24);animation:up .22s cubic-bezier(.2,.9,.3,1);
  padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(20px);opacity:.65}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line2)}
.sheet-head h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.02em}
.sheet-head .icon{width:32px;height:32px;border:0;background:#F4EEEB;border-radius:50%;color:#8C7E85;font-size:13px;cursor:pointer}
.sheet-body{padding:2px 18px 6px}
@media(min-width:640px){
  .overlay{align-items:center;padding:26px}
  .sheet{border-radius:24px;max-height:88vh}
}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;max-width:min(88vw,480px);
  background:rgba(41,32,37,.94);color:#fff;font-size:12.5px;font-weight:600;line-height:1.45;padding:10px 16px;border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.22);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="brandmark">💎</div>
    <div>
      <h1>블리비의원 금액권 수첩</h1>
      <p id="brandMeta">가격 기준 2026-11-25 · 지점 홈페이지 반영</p>
    </div>
  </header>

  <div class="sticky">
    <div class="branchtabs" id="branchTabs" role="tablist" aria-label="지점 선택"></div>
    <nav class="sectiontabs" id="sectionTabs" aria-label="메뉴">
      <button data-act="tab" data-tab="summary" class="on">요약</button>
      <button data-act="tab" data-tab="price">가격표</button>
      <button data-act="tab" data-tab="history">내역</button>
      <button data-act="tab" data-tab="branch">지점</button>
    </nav>
  </div>

  <main>
    <section id="view-summary" class="view"></section>
    <section id="view-price" class="view" hidden></section>
    <section id="view-history" class="view" hidden></section>
    <section id="view-branch" class="view" hidden></section>
  </main>

  <footer class="foot">
    가격·이벤트는 블리비의원 지점 홈페이지 게시 내용을 2026-11-25에 수집한 것입니다.<br>
    실제 결제 금액·적용 조건은 방문 전 지점에 확인해 주세요.
  </footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">금액권 충전</h2>
      <button class="icon" data-act="close" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>

var VATRATE = DATA.vatRate;
var NUMF = new Intl.NumberFormat('ko-KR');
var LSKEY = 'velyb.voucher.manager.v1';

var BRORDER = DATA.branches.map(function(b){ return b.id; });

/* ---------------- utils ---------------- */
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function num(v){
  var n = Number(String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''));
  return isFinite(n) ? n : 0;
}
function money(n){ return (n == null || !isFinite(n)) ? '–' : NUMF.format(Math.round(n)) + '원'; }
function money0(n){ return (n == null || !isFinite(n)) ? '–' : NUMF.format(Math.round(n)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function todayISO(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function isDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }
function dtext(s){ var p = String(s || '').split('-'); return p.length === 3 ? p[0] + '.' + p[1] + '.' + p[2] : String(s || ''); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function normName(s){
  return String(s || '').normalize('NFKC')
    .replace(/[\u2665\u2764]\s*[^\u2665\u2764]{1,15}?\s*[\u2665\u2764]\s*/g, '')
    .replace(/\u25C6\s*[^\u25C6]{2,15}?\s*\u25C6\s*/g, '')
    .replace(/\[[^\]]*\]\s*/g, '')
    .replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0F\u2B50\u2B55\u25C0-\u25FF]/gu, '')
    .replace(/\s+/g, ' ').trim()
    .replace(/^[-–:·]\s*/, '');
}
/* 체험가·한정가는 같은 1회 혜택입니다.
   같은 시술이면 이벤트·체험가/한정가 표기가 달라도 같은 키로 묶습니다. */
function famKey(name){
  return normName(name)
    .replace(/\s*(?:체험가|한정가)\s*/g, ' ')
    .replace(/\s*1\s*부위/g, '')
    .replace(/\s*1\s*회/g, '')
    .replace(/\s+[-–]\s+/g, ' ')
    .replace(/\s*[-–]\s*$/, '')
    .replace(/\s+/g, ' ').trim();
}
function clsOf(name){
  if (/체험가/.test(name)) return 'trial';
  if (/한정가/.test(name)) return 'limited';
  return 'normal';
}
function clsLabel(c){ return c === 'trial' ? '체험가' : (c === 'limited' ? '한정가' : '일반'); }
function clsSetOf(c){
  if (c && c.clsSet && c.clsSet.length) return c.clsSet;
  return [c ? c.cls : 'normal'];
}
function badgeFor(c){
  return clsSetOf(c).length > 1
    ? '<span class="badge b-both">체험·한정가</span>'
    : '<span class="badge b-' + c.cls + '">' + clsLabel(c.cls) + '</span>';
}
function oneKey(c){ return c.fam || c.key; }
function calc(supply){
  var s = Math.max(0, Math.round(num(supply)));
  var v = Math.round(s * VATRATE);
  return { supply: s, vat: v, total: s + v };
}

/* ---------------- storage ---------------- */
var storeOK = (function(){
  try { localStorage.setItem('__velyb_t', '1'); localStorage.removeItem('__velyb_t'); return true; }
  catch (e) { return false; }
})();
var NAME_PREFIX = 'VELYB_BACKUP:';
function readFallback(){
  try {
    var v = window.name || '';
    return v.indexOf(NAME_PREFIX) === 0 ? v.slice(NAME_PREFIX.length) : null;
  } catch (e) { return null; }
}
function writeFallback(json){
  try { window.name = NAME_PREFIX + json; return true; } catch (e) { return false; }
}

function blankState(){
  var s = { v: 1, active: 'ydp', meta: { seeded: false, seedDismissed: false }, branches: {} };
  BRORDER.forEach(function(id){ s.branches[id] = { charges: [], uses: [], manual: {} }; });
  return s;
}
function normCharge(c){
  return {
    id: String(c.id || uid()),
    date: isDate(c.date) ? c.date : todayISO(),
    amount: Math.max(0, Math.round(num(c.amount))),
    bonus: Math.max(0, Math.round(num(c.bonus))),
    memo: String(c.memo || '').slice(0, 80),
    createdAt: num(c.createdAt) || Date.now()
  };
}
function normUse(u){
  var c = calc(u.supply);
  var name = String(u.name || '시술').slice(0, 120);
  var clsRaw = u.cls;
  var useCls = (['trial', 'limited', 'normal'].indexOf(clsRaw) >= 0 ? clsRaw : clsOf(name));
  var rawKey = String(u.key || name);
  return {
    id: String(u.id || uid()),
    date: isDate(u.date) ? u.date : todayISO(),
    name: name,
    /* 체험가·한정가는 시술 단위 키로 통일(예전 기록의 키도 여기서 옮겨집니다) */
    key: (useCls === 'normal' ? String(u.key || name) : famKey(rawKey)),
    cls: (['trial', 'limited', 'normal'].indexOf(u.cls) >= 0 ? u.cls : clsOf(name)),
    supply: c.supply,
    vat: (u.vat != null ? Math.round(num(u.vat)) : c.vat),
    total: (u.total != null ? Math.round(num(u.total)) : c.total),
    memo: String(u.memo || '').slice(0, 80),
    forced: !!u.forced,
    createdAt: num(u.createdAt) || Date.now()
  };
}
function normalizeState(p){
  var s = blankState();
  if (!p || typeof p !== 'object') return s;
  if (BRMAP[p.active]) s.active = p.active;
  if (p.meta && typeof p.meta === 'object') {
    s.meta.seeded = !!p.meta.seeded;
    s.meta.seedDismissed = !!p.meta.seedDismissed;
  }
  BRORDER.forEach(function(id){
    var src = (p.branches && p.branches[id]) || {};
    var dst = s.branches[id];
    if (Array.isArray(src.charges)) dst.charges = src.charges.filter(function(x){ return x && x.id; }).map(normCharge);
    if (Array.isArray(src.uses)) dst.uses = src.uses.filter(function(x){ return x && x.id; }).map(normUse);
    if (src.manual && typeof src.manual === 'object') {
      Object.keys(src.manual).forEach(function(k){
        if (src.manual[k]) dst.manual[famKey(k)] = { at: String((src.manual[k] && src.manual[k].at) || '') };
      });
    }
  });
  return s;
}
function seedState(){
  var s = blankState();
  var sb = s.branches[SEED.branch];
  SEED.charges.forEach(function(c, i){
    sb.charges.push({
      id: 'seed-c' + (i + 1), date: c.date,
      amount: Math.round(num(c.amount)), bonus: Math.round(num(c.bonus)),
      memo: c.memo, createdAt: Date.parse(c.date + 'T10:0' + i + ':00') || Date.now()
    });
  });
  SEED.uses.forEach(function(u, i){
    var c = calc(u.supply);
    var seedCls = (['trial', 'limited', 'normal'].indexOf(u.cls) >= 0 ? u.cls : clsOf(u.name));
    sb.uses.push({
      id: 'seed-u' + (i + 1), date: u.date, name: u.name, cls: seedCls,
      key: (seedCls === 'normal' ? String(u.key || u.name) : famKey(String(u.key || u.name))),
      supply: c.supply, vat: c.vat, total: c.total,
      memo: u.memo, forced: !!u.forced,
      createdAt: (Date.parse(u.date + 'T11:' + pad2(i * 7) + ':00') || Date.now())
    });
  });
  s.meta.seeded = (SEED.charges.length + SEED.uses.length) > 0;
  return s;
}
function loadState(){
  if (!storeOK) {
    var fb = readFallback();
    if (fb) {
      try { return normalizeState(JSON.parse(fb)); } catch (e) {}
    }
    return seedState();
  }
  try {
    var raw = localStorage.getItem(LSKEY);
    if (!raw) return seedState();
    return normalizeState(JSON.parse(raw));
  } catch (e) { return seedState(); }
}
function saveState(){
  var json = JSON.stringify(S);
  if (!storeOK) return writeFallback(json);
  try { localStorage.setItem(LSKEY, json); return true; }
  catch (e) { return writeFallback(json); }
}

var S = loadState();
var UI = { tab: 'summary', filter: 'all', q: '', limit: 30, open: null, hfilter: 'all' };
var MODAL = null;

function SB(){ return S.branches[S.active]; }
function BR(){ return BRMAP[S.active]; }

/* ---------------- derived ---------------- */
function totals(sb){
  var paid = 0, bonus = 0, used = 0, count = 0;
  sb.charges.forEach(function(c){ paid += c.amount; bonus += c.bonus; });
  sb.uses.forEach(function(u){ used += u.total; count++; });
  return { paid: paid, bonus: bonus, charged: paid + bonus, used: used, balance: paid + bonus - used, count: count };
}
function usedInfo(sb, key){
  var n = 0;
  sb.uses.forEach(function(u){ if (u.key === key) n++; });
  return { used: (n > 0) || !!sb.manual[key], records: n, manual: !!sb.manual[key] };
}
function uniqFams(b, cls){
  var seen = {}, out = [];
  b.catalog.forEach(function(c){
    if (c.cls === 'normal') return;
    if (cls && clsSetOf(c).indexOf(cls) < 0) return;
    var f = oneKey(c);
    if (!seen[f]) { seen[f] = 1; out.push(f); }
  });
  return out;
}
function merged(sb){
  var rows = [];
  sb.charges.forEach(function(c){
    rows.push({ t: 'charge', id: c.id, date: c.date, createdAt: c.createdAt, amount: c.amount, bonus: c.bonus, memo: c.memo });
  });
  sb.uses.forEach(function(u){
    rows.push({ t: 'use', id: u.id, date: u.date, createdAt: u.createdAt, u: u });
  });
  rows.sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
  return rows;
}

      '<button type="button" class="chip" data-act="quick" data-amount="" data-bonus="0">보너스 없음</button>' +
    '</div>' +
    '<label class="field"><span>메모 (선택)</span><input type="text" id="cMemo" maxlength="60" value="' + (rec ? esc(rec.memo) : '') + '" placeholder="예: 50만 멤버십 결제"></label>' +
    '<div class="calcbox">' +
      '<div><span>실결제</span><b id="sumPaid" class="num">0원</b></div>' +
      '<div><span>보너스 적립</span><b id="sumBonus" class="num">0원</b></div>' +
      '<div class="total"><span>충전 합계</span><b id="sumTotal" class="num">0원</b></div>' +
    '</div>' +
    '<div class="formfoot"><button type="button" class="btn ghost" data-act="close">취소</button>' +
      '<button type="submit" class="btn primary">' + (rec ? '수정 저장' : '충전 기록') + '</button></div>' +
  '</form>';
  openSheet(rec ? '충전 내역 수정' : '금액권 충전', body);
  updateChargeCalc();
}
function updateChargeCalc(){
  var a = Math.max(0, Math.round(num(($('#cAmount') || {}).value)));
  var b = Math.max(0, Math.round(num(($('#cBonus') || {}).value)));
  if ($('#sumPaid')) $('#sumPaid').textContent = money(a);
  if ($('#sumBonus')) $('#sumBonus').textContent = money(b);
  if ($('#sumTotal')) $('#sumTotal').textContent = money(a + b);
}
function saveCharge(form){
  var sb = SB();
  var date = $('#cDate').value || todayISO();
  var amount = Math.max(0, Math.round(num($('#cAmount').value)));
  var bonus = Math.max(0, Math.round(num($('#cBonus').value)));
  var memo = $('#cMemo').value.trim().slice(0, 60);
  if (!isDate(date)) { toast('날짜를 확인해 주세요.'); return; }
  if (!amount && !bonus) { toast('결제 금액을 입력해 주세요.'); $('#cAmount').focus(); return; }
  var id = form.dataset.id;
  if (id) {
    var c = sb.charges.filter(function(x){ return x.id === id; })[0];
    if (c) { c.date = date; c.amount = amount; c.bonus = bonus; c.memo = memo; }
  } else {
    sb.charges.push({ id: uid(), date: date, amount: amount, bonus: bonus, memo: memo, createdAt: Date.now() });
  }
  saveState(); closeSheet(); renderAll();
  toast(id ? '충전 내역을 수정했습니다.' : '금액권 ' + money(amount + bonus) + ' 충전을 기록했습니다.');
}

/* ---------------- use modal ---------------- */
function openUse(id, presetKey){
  var sb = SB(), b = BR();
  var rec = id ? sb.uses.filter(function(u){ return u.id === id; })[0] : null;
  var preset = (!rec && presetKey) ? b.catalog.filter(function(c){ return c.key === presetKey; })[0] : null;
  var name = rec ? rec.name : (preset ? preset.name : '');
  var supply = rec ? rec.supply : (preset ? preset.minPrice : '');
  var date = rec ? rec.date : todayISO();
  var rangeHint = (preset && preset.minPrice !== preset.maxPrice)
    ? '<p class="hint">이벤트별 금액이 달라 최저가로 채웠습니다. 실제 결제 금액으로 고쳐 주세요.</p>' : '';

  var body = '<form id="useForm" data-id="' + (rec ? esc(rec.id) : '') + '">' +
    '<label class="field"><span>날짜</span><input type="date" id="uDate" value="' + date + '" required></label>' +
    '<div class="field"><span>시술명</span>' +
      '<div class="searchwrap"><input type="text" id="uName" value="' + esc(name) + '" placeholder="가격표에서 검색하거나 직접 입력" autocomplete="off" spellcheck="false">' +
      '<button type="button" class="clear" data-act="clear-name" aria-label="지우기"' + (name ? '' : ' hidden') + '>✕</button></div>' +
      '<div class="suggest" id="uSuggest" hidden></div>' +
      '<p class="hint">가격표에 없는 시술은 이름을 직접 입력하고 금액을 적으면 됩니다.</p>' +
    '</div>' +
    '<label class="field"><span>공급가 · 부가세 별도 (원)</span><input type="number" id="uPrice" inputmode="numeric" min="0" step="100" ' +
      'value="' + (supply === '' ? '' : supply) + '" placeholder="예: 2900" required></label>' +
    rangeHint +
    '<div class="calcbox">' +
      '<div><span>공급가</span><b id="calcSupply" class="num">0원</b></div>' +
      '<div><span>부가세 10%</span><b id="calcVat" class="num">0원</b></div>' +
      '<div class="total"><span>총 차감액</span><b id="calcTotal" class="num">0원</b></div>' +
    '</div>' +
    '<div class="flag" id="uFlag" hidden></div>' +
    '<div class="guard" id="uGuard" hidden>' +
      '<b>이 지점에서 이미 이용한 체험가·한정가 항목입니다</b>' +
      '<p id="uGuardWhy"></p>' +
      '<p class="hint">체험가와 한정가는 같은 1회 혜택으로 계산합니다.</p>' +
      '<label class="check"><input type="checkbox" id="uForce"> 그래도 기록하기 (강제)</label>' +
    '</div>' +
    '<label class="field"><span>메모 (선택)</span><input type="text" id="uMemo" maxlength="60" value="' + (rec ? esc(rec.memo) : '') + '" placeholder="예: 영등포점 방문"></label>' +
    '<p class="balancehint" id="uBal"></p>' +
    '<div class="formfoot"><button type="button" class="btn ghost" data-act="close">취소</button>' +
      '<button type="submit" class="btn primary">' + (rec ? '수정 저장' : '기록 저장') + '</button></div>' +
  '</form>';
  openSheet(rec ? '시술 기록 수정' : '시술 기록', body);
  updateUseCalc();
}
function updateUseCalc(){
  var p = $('#uPrice');
  if (!p) return;
  var c = calc(p.value);
  if ($('#calcSupply')) $('#calcSupply').textContent = money(c.supply);
  if ($('#calcVat')) $('#calcVat').textContent = money(c.vat);
  if ($('#calcTotal')) $('#calcTotal').textContent = money(c.total);
  var t = totals(SB());
  var bal = $('#uBal');
  if (bal) {
    if (c.total > 0) {
      bal.className = 'balancehint' + (c.total > t.balance ? ' warn' : '');
      bal.textContent = (c.total > t.balance)
        ? '현재 잔액(' + money(t.balance) + ')보다 ' + money(c.total - t.balance) + ' 많습니다. 기록 후 충전하면 잔액이 맞춰집니다.'
        : '기록 후 남은 잔액 ' + money(t.balance - c.total) + ' · 현재 잔액 ' + money(t.balance);
    } else { bal.textContent = ''; }
  }
  refreshUseFlags();
}
function refreshUseFlags(){
  var f = $('#useForm');
  if (!f) return;
  var name = $('#uName').value.trim();
  var flag = $('#uFlag'), guard = $('#uGuard');
  if (!flag || !guard) return;
  if (!name) { flag.hidden = true; guard.hidden = true; return; }
  var sb = SB();
  var prev = f.dataset.id ? sb.uses.filter(function(x){ return x.id === f.dataset.id; })[0] : null;
  var same = !!(prev && prev.name === name);
  var key = same ? prev.key : famKey(name);
  var cls = same ? prev.cls : clsOf(name);
  var ui = usedInfo(sb, key);
  if (cls === 'normal') {
    flag.hidden = true;
  } else {
    flag.hidden = false;
    flag.innerHTML = '<span class="badge b-' + cls + '">' + clsLabel(cls) + '</span>' +
      '<span>' + (ui.used ? '이 지점 이용 완료' : '이 지점 미이용 · 1회 이용 가능') + '</span>';
  }
  var editing = f.dataset.id;
  var other = ui.records;
  if (editing) {
    other = sb.uses.filter(function(u){ return u.key === key && u.id === editing; }).length ? ui.records - 1 : ui.records;
  }
  var blocked = (cls !== 'normal') && (ui.manual || other > 0);
  guard.hidden = !blocked;
  if (blocked && $('#uGuardWhy')) {
    $('#uGuardWhy').textContent = ui.manual
      ? '가격표에서 이용 완료로 체크된 항목입니다. 필요하면 아래에 체크하고 기록하세요.'
      : '이 지점 기록에 같은 시술이 ' + other + '건 있습니다. 필요하면 아래에 체크하고 기록하세요.';
  }
  if (!blocked && $('#uForce')) $('#uForce').checked = false;
}
function suggestNames(q){
  var box = $('#uSuggest');
  if (!box) return;
  q = String(q || '').trim().toLowerCase();
  if (!q) { box.hidden = true; box.innerHTML = ''; return; }
  var b = BR();
  var hits = b.catalog.filter(function(c){ return c.name.toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
  if (!hits.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = hits.map(function(c){
    var price = (c.minPrice === c.maxPrice) ? money(c.minPrice) : money(c.minPrice) + '~';
    return '<button type="button" class="sitem" data-act="apply" data-key="' + esc(c.key) + '">' +
      '<span class="sname">' + esc(c.name) + '</span><span class="sprice num">' + price + '</span></button>';
  }).join('');
}
function applySuggestion(key){
  var c = BR().catalog.filter(function(x){ return x.key === key; })[0];
  if (!c) return;
  var n = $('#uName'), p = $('#uPrice');
  if (n) n.value = c.name;
  if (p) p.value = c.minPrice;
  var box = $('#uSuggest');
  if (box) { box.hidden = true; box.innerHTML = ''; }
  var hint = $('#useForm .hint');
  updateUseCalc();
  if (c.minPrice !== c.maxPrice && hint) {
    hint.textContent = '이벤트별 금액이 달라 최저가로 채웠습니다. 실제 결제 금액으로 고쳐 주세요.';
  }
}
function saveUse(form){
  var name = $('#uName').value.trim();
  var c = calc($('#uPrice').value);
  var date = $('#uDate').value || todayISO();
  var memo = $('#uMemo').value.trim().slice(0, 60);
  if (!name) { toast('시술명을 입력해 주세요.'); $('#uName').focus(); return; }
  if (!isDate(date)) { toast('날짜를 확인해 주세요.'); return; }
  if (c.supply <= 0) { toast('공급가를 입력해 주세요.'); $('#uPrice').focus(); return; }
  var guard = $('#uGuard'), force = $('#uForce');
  if (guard && !guard.hidden && !(force && force.checked)) {
    toast('이미 이용한 체험가·한정가 항목입니다. 강제 기록을 체크해 주세요.');
    return;
  }
  var sb = SB();
  var id = form.dataset.id;
  var prev = id ? sb.uses.filter(function(x){ return x.id === id; })[0] : null;
  var same = !!(prev && prev.name === name);
  var key = same ? prev.key : famKey(name);
  var cls = same ? prev.cls : clsOf(name);
  var forced = !!(guard && !guard.hidden && force && force.checked);
  var before = usedInfo(sb, key).used;
  if (id) {
    var u = sb.uses.filter(function(x){ return x.id === id; })[0];
    if (u) {
      u.date = date; u.name = name; u.key = key; u.cls = cls;
      u.supply = c.supply; u.vat = c.vat; u.total = c.total;
      u.memo = memo; u.forced = forced;
    }
  } else {
    sb.uses.push({
      id: uid(), date: date, name: name, key: key, cls: cls,
      supply: c.supply, vat: c.vat, total: c.total,
      memo: memo, forced: forced, createdAt: Date.now()
    });
  }
  saveState(); closeSheet(); renderAll();
  if (id) {
    toast('시술 기록을 수정했습니다.');
  } else if (cls !== 'normal' && !before) {
    toast(clsLabel(cls) + ' 이용 완료로 표시했습니다 · ' + money(c.total) + ' 차감');
  } else {
    toast('시술 ' + money(c.total) + ' 기록을 저장했습니다.');
  }
}

/* ---------------- actions ---------------- */
function toggleUsed(key){
  var sb = SB(), ui = usedInfo(sb, key);
  if (ui.records > 0) {
    toast('기록 ' + ui.records + '건이 있어 이용 완료 상태입니다. 내역에서 기록을 지우면 해제됩니다.');
    return;
  }
  if (ui.manual) {
    delete sb.manual[key];
    toast('이용 완료 체크를 해제했습니다.');
  } else {
    sb.manual[key] = { at: todayISO() };
    toast('이용 완료로 체크했습니다.');
  }
  saveState(); renderAll();
}
function delCharge(id){
  if (!confirm('이 충전 기록을 삭제할까요?')) return;
  var sb = SB();
  sb.charges = sb.charges.filter(function(c){ return c.id !== id; });
  saveState(); renderAll(); toast('충전 기록을 삭제했습니다.');
}
function delUse(id){
  if (!confirm('이 시술 기록을 삭제할까요?\n이용 완료 표시도 함께 해제됩니다.')) return;
  var sb = SB();
  sb.uses = sb.uses.filter(function(u){ return u.id !== id; });
  saveState(); renderAll(); toast('시술 기록을 삭제했습니다.');
}
function resetBranch(){
  var b = BR();
  if (!confirm(b.name + '의 금액권·시술 기록과 이용 체크를 모두 지웁니다.\n되돌릴 수 없습니다.')) return;
  S.branches[S.active] = { charges: [], uses: [], manual: {} };
  if (S.active === SEED.branch) S.meta.seeded = false;
  saveState(); renderAll(); toast(b.name + ' 기록을 초기화했습니다.');
}
function exportData(){
  try {
    var payload = { app: 'velyb-voucher-manager', version: 1, exportedAt: new Date().toISOString(), state: S };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    var d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = '블리비의원-금액권-백업-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    toast('백업 파일을 내려받았습니다.');
  } catch (e) {
    toast('백업 파일을 만들 수 없습니다.');
  }
}
function importFile(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var parsed = null;
    try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
    var st = parsed && parsed.state ? parsed.state : parsed;
    if (!st || typeof st !== 'object' || !st.branches) {
      alert('파일을 읽을 수 없습니다. 이 앱에서 내보낸 JSON 백업인지 확인해 주세요.');
      return;
    }
    var c1 = 0, c2 = 0;
    BRORDER.forEach(function(id){
      var x = st.branches[id] || {};
      c1 += Array.isArray(x.charges) ? x.charges.length : 0;
      c2 += Array.isArray(x.uses) ? x.uses.length : 0;
    });
    if (!confirm('충전 ' + c1 + '건 · 시술 ' + c2 + '건을 가져옵니다.\n지금 이 브라우저의 기록은 모두 덮어씁니다. 계속할까요?')) return;
    S = normalizeState(st);
    saveState(); renderAll(); setTab('summary');
    toast('백업을 복원했습니다.');
  };
  reader.onerror = function(){ alert('파일을 읽지 못했습니다.'); };
  reader.readAsText(file);
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.dataset.act;
  if (act === 'branch') {
    if (S.active !== el.dataset.b) {
      S.active = el.dataset.b;
      UI.q = ''; UI.filter = 'all'; UI.open = null; UI.limit = 30; UI.hfilter = 'all';
      saveState(); renderAll();
    }
  } else if (act === 'tab') {
    setTab(el.dataset.tab);
  } else if (act === 'open-charge') {
    openCharge(el.dataset.id || null);
  } else if (act === 'open-use') {
    openUse(null, el.dataset.key || null);
  } else if (act === 'edit-charge') {
    openCharge(el.dataset.id);
  } else if (act === 'edit-use') {
    openUse(el.dataset.id, null);
  } else if (act === 'del-charge') {
    delCharge(el.dataset.id);
  } else if (act === 'del-use') {
    delUse(el.dataset.id);
  } else if (act === 'filter') {
    UI.filter = el.dataset.f; UI.limit = 30; renderPrice();
  } else if (act === 'hfilter') {
    UI.hfilter = el.dataset.f; renderHistory();
  } else if (act === 'more') {
    UI.limit += 30; renderPriceList();
  } else if (act === 'offers') {
    UI.open = (UI.open === el.dataset.key ? null : el.dataset.key);
    renderPriceList();
  } else if (act === 'pick') {
    openUse(null, el.dataset.key);
  } else if (act === 'toggle') {
    toggleUsed(el.dataset.key);
  } else if (act === 'close') {
    closeSheet();
  } else if (act === 'export') {
    exportData();
  } else if (act === 'import') {
    var inp = $('#importFile');
    if (inp) inp.click();
  } else if (act === 'reset') {
    resetBranch();
  } else if (act === 'go-event') {
    UI.q = el.dataset.name || '';
    UI.filter = 'all'; UI.limit = 30;
    setTab('price');
    renderPrice();
  } else if (act === 'apply') {
    applySuggestion(el.dataset.key);
  } else if (act === 'clear-name') {
    var n = $('#uName');
    if (n) { n.value = ''; n.focus(); }
    var clr2 = $('#useForm .searchwrap .clear');
    if (clr2) clr2.hidden = true;
    var box = $('#uSuggest');
    if (box) { box.hidden = true; box.innerHTML = ''; }
    updateUseCalc();
  } else if (act === 'quick') {
    var a = $('#cAmount'), b = $('#cBonus');
    if (a && el.dataset.amount !== '') a.value = el.dataset.amount;
    if (b) b.value = el.dataset.bonus || '0';
    updateChargeCalc();
    if (a) { try { a.focus(); } catch (e) {} }
  } else if (act === 'used-info') {
    toggleUsed(el.dataset.key);
  } else if (act === 'dismiss-seed') {
    S.meta.seedDismissed = true; saveState(); renderAll();
  }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if (!t || !t.id) return;
  if (t.id === 'priceSearch') {
    UI.q = t.value; UI.limit = 30; renderPriceList();
  } else if (t.id === 'cAmount' || t.id === 'cBonus') {
    updateChargeCalc();
  } else if (t.id === 'uPrice') {
    updateUseCalc();
  } else if (t.id === 'uName') {
    var clr = $('#useForm .searchwrap .clear');
    if (clr) clr.hidden = !t.value;
    suggestNames(t.value);
    updateUseCalc();
  }
});

document.addEventListener('submit', function(e){
  var f = e.target;
  if (!f || !f.id) return;
  if (f.id === 'chargeForm') { e.preventDefault(); saveCharge(f); }
  else if (f.id === 'useForm') { e.preventDefault(); saveUse(f); }
});

$('#overlay').addEventListener('mousedown', function(e){
  if (e.target === $('#overlay')) closeSheet();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet();
});
$('#importFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  importFile(f);
  e.target.value = '';
});

/* ---------------- render all ---------------- */
function renderAll(){
  renderBranchTabs();
  renderSectionTabs();
  renderSummary();
  renderPrice();
  renderHistory();
  renderBranchInfo();
}

(function init(){
  if (!DATA || !DATA.branches) {
    document.body.innerHTML = '<p style="padding:24px;font-size:14px">가격 데이터를 불러오지 못했습니다.</p>';
    return;
  }
  if (!BRMAP[S.active]) S.active = BRORDER[0];
  $('#brandMeta').textContent = '가격 기준 ' + DATA.generatedAt + ' · 지점 홈페이지 반영';
  if (S.meta && S.meta.seeded) saveState();
  renderAll();
  setTab('summary');
  if (!storeOK) {
    setTimeout(function(){ toast('이 브라우저는 자동 저장이 제한됩니다. 백업을 받아 두세요.'); }, 900);
  }
})();

})();
</script>
</body>
